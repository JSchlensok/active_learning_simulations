[project]
name = "active-learning-simulations"
version = "1.0.0"
description = "Biocentral API usage for simulating active learning campaigns on protein datasets"
requires-python = "==3.12.11"
dependencies = [
    "pandas-stubs==2.3.3.251201",
    "altair>=5.3",
    "pandas>=2.2",
    "polars>=1.0",
    "seaborn>=0.13",
    "streamlit>=1.36",
    "vl-convert-python>=1.6",
    "biocentral-api",
    "biocentral-vis>=2.0.0,<3.0.0",
    "biotrainer-core>=2.0.0,<3.0.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "mypy>=1.5",
    "ruff>=0.16.4",
]

[tool.uv.sources]
biocentral-api = { path = "../biocentral/biocentral_api/python", editable = true }
